<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a25">
  <title>Taskboard</title>
  <link rel="stylesheet" href="/style.css?v=__STYLE_HASH__">
  <script type="module" src="/tasks.js?v=__SCRIPT_HASH__"></script>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span class="brand"><span class="brand-mark" aria-hidden="true">✓</span> Taskboard</span>
      <button id="refresh" class="button secondary refresh" type="button" disabled>Refresh tasks</button>
    </div>
  </div>
  <main>
    <header class="page-heading">
      <h1>My tasks</h1>
    </header>

    <div class="workspace">
      <section class="board" aria-labelledby="board-heading">
        <h2 id="board-heading">Task list</h2>
        <form id="create-task">
          <label for="title">New task</label>
          <div class="entry">
            <input id="title" name="title" maxlength="120" required placeholder="What needs doing?">
            <button class="button primary" type="submit" disabled><span aria-hidden="true">+</span> Add task</button>
          </div>
        </form>

        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter tasks by status">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="open" aria-pressed="false">Open</button>
            <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <input type="search" id="search" aria-label="Search tasks" placeholder="Search tasks">
        </div>

        <p id="status" class="feedback" role="status">Loading tasks…</p>
        <noscript>Enable JavaScript to load and manage your tasks.</noscript>
        <div id="empty" class="empty" hidden>
          <strong id="empty-title"></strong>
          <p id="empty-detail"></p>
          <button class="button secondary" id="clear-filters" type="button" hidden>Clear filters</button>
        </div>
        <ul id="tasks" aria-label="Task list"></ul>
      </section>

      <aside class="overview" aria-labelledby="overview-heading">
        <h2 id="overview-heading">Progress</h2>
        <label class="progress-label" for="progress">Completion <output id="percent">—</output></label>
        <progress id="progress" max="100" value="0"></progress>
        <dl class="totals">
          <div><dt>Open</dt><dd id="open-count">—</dd></div>
          <div><dt>Completed</dt><dd id="done-count">—</dd></div>
        </dl>
      </aside>
    </div>

    <section class="board practice" aria-labelledby="practice-heading">
      <h2 id="practice-heading">HTTP status practice</h2>
      <p class="feedback" id="practice-help">Choose a status code, send a request, and watch the counts in Prometheus.</p>
      <form id="status-practice" aria-describedby="practice-help">
        <label for="practice-code">Response status</label>
        <div class="entry">
          <select id="practice-code" name="code">
            <option value="200">200 OK</option>
            <option value="400">400 Bad Request</option>
            <option value="404">404 Not Found</option>
            <option value="429">429 Too Many Requests</option>
            <option value="500">500 Internal Server Error</option>
            <option value="503">503 Service Unavailable</option>
          </select>
          <button class="button primary" type="submit">Send request</button>
        </div>
      </form>
      <p id="practice-result" class="feedback" role="status"></p>
    </section>
  </main>

  <dialog id="task-dialog" aria-labelledby="dialog-title">
    <form id="task-action">
      <h2 id="dialog-title"></h2>
      <div id="edit-field">
        <label for="edit-title">Task title</label>
        <input id="edit-title" maxlength="120">
      </div>
      <p id="delete-text" hidden></p>
      <p id="dialog-status" class="feedback error" role="status"></p>
      <div class="actions">
        <button class="button secondary" id="cancel" type="button">Cancel</button>
        <button class="button primary" id="confirm" type="submit"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
