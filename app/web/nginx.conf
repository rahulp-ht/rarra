log_format taskboard escape=json
    '{"event":"web_request","request_id":"$request_id","method":"$request_method",'
    '"status":"$status","duration_seconds":$request_time,"upstream_status":"$upstream_status"}';

server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log /dev/stdout taskboard;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
