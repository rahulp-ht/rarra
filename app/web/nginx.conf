server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
