apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus.yaml
  - loki.yaml
  - grafana.yaml
  - alloy.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
  - name: loki-config
    namespace: monitoring
    files:
      - loki.yml
  - name: alloy-config
    namespace: monitoring
    files:
      - config.alloy
  - name: grafana-datasources
    namespace: monitoring
    files:
      - datasources.yaml
  - name: grafana-providers
    namespace: monitoring
    files:
      - dashboards.yaml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - taskboard.json
