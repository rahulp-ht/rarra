apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: set-data-owner
          image: busybox:1.37
          command: [chown, "10001", /data]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: loki
          image: grafana/loki:3.5.5
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
          args:
            - -config.file=/etc/taskboard/loki.yml
          ports:
            - name: http
              containerPort: 3100
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /loki
            - name: config
              mountPath: /etc/taskboard
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
        - name: config
          configMap:
            name: loki-config
