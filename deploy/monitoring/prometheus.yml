global:
  scrape_interval: 15s
scrape_configs:
  - job_name: taskboard-api
    dns_sd_configs:
      - names: [api-metrics.taskboard.svc.cluster.local]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: kubelet-resource
    scheme: https
    metrics_path: /metrics/resource
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      # Minikube's kubelet uses a self-signed serving certificate.
      insecure_skip_verify: true
    metric_relabel_configs:
      - source_labels: [namespace, __name__]
        separator: ";"
        regex: taskboard;pod_(cpu_usage_seconds_total|memory_working_set_bytes)
        action: keep
